<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Export Widget</title>
  <!-- 1. Grist plugin API -->
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <!-- 2. SheetJS for Excel export -->
  <script src="https://cdn.sheetjs.com/xlsx-0.19.2/package/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 1em; }
    button { margin-right: .5em; padding: .5em 1em; }
    #error { color: red; margin-top: .5em; display: none; }
    table { display: none; }
  </style>
</head>
<body>

  <!-- 3. Widget UI -->
  <button id="btnCsv">Export CSV</button>
  <button id="btnXlsx">Export Excel</button>
  <div id="error"></div>

  <script>
    grist.ready({
      requiredAccess: 'full',
      columns: [
        { name: 'exportCols',   title: 'Columns to export',   allowMultiple: true },
        { name: 'filenameCols', title: 'Columns for filename', allowMultiple: true }
      ],
      onEditOptions: () => {}
    });

    let allRecords = [];
    let mappings  = {};

    grist.onRecords((records, map) => {
      allRecords = records || [];
      mappings   = map || {};
    });

    function formatValue(val) {
      if (val == null) { return ''; }
      if (typeof val === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(val)) {
        return val.slice(0,10);
      }
      if (typeof val === 'number' && val > 8.64e15) {
        return new Date(val).toISOString().slice(0,10);
      }
      return val;
    }

    function doExportCSV() {
      const cols = (mappings.exportCols||[]).filter(c => c!=='id');
      if (!cols.length) {
        const e = document.getElementById('error');
        e.textContent = "Select columns first.";
        e.style.display = 'block';
        return;
      }
      document.getElementById('error').style.display = 'none';

      // build header labels by replacing underscores with spaces
      const headerLabels = cols.map(c => c.replace(/_/g,' '));

      // build rows array-of-arrays
      const rows = allRecords.map(r => cols.map(c => formatValue(r[c])));

      // CSV text
      const csv = [headerLabels, ...rows]
        .map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(','))
        .join('\r\n');

      // filename from first record
      const names = mappings.filenameCols||[];
      const first = allRecords[0]||{};
      const base  = names.map(c=>first[c]).filter(v=>v).join(' ') || 'export';

      const blob = new Blob([csv], {type:'text/csv'});
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = `${base}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function doExportXLSX() {
      const cols = (mappings.exportCols||[]).filter(c => c!=='id');
      if (!cols.length) {
        const e = document.getElementById('error');
        e.textContent = "Select columns first.";
        e.style.display = 'block';
        return;
      }
      document.getElementById('error').style.display = 'none';

      // header labels with spaces
      const headerLabels = cols.map(c => c.replace(/_/g,' '));

      // build array-of-arrays: first row headers, then data rows
      const rows = allRecords.map(r => cols.map(c => formatValue(r[c])));
      const aoa  = [headerLabels, ...rows];

      // create sheet & workbook
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Export');

      // filename from first record
      const names = mappings.filenameCols||[];
      const first = allRecords[0]||{};
      const base  = names.map(c=>first[c]).filter(v=>v).join(' ') || 'export';

      XLSX.writeFile(wb, `${base}.xlsx`);
    }

    document.getElementById('btnCsv')
      .addEventListener('click', doExportCSV);
    document.getElementById('btnXlsx')
      .addEventListener('click', doExportXLSX);
  </script>
</body>
</html>
